name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Validate, test, lint and build
        run: |
          chmod +x gradlew scripts/check.sh
          scripts/check.sh
      - name: Package unsigned release and source
        run: |
          python3 scripts/package_artifacts.py --sdk "$ANDROID_HOME"
          python3 scripts/package_source.py
          python3 scripts/write_checksums.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanly-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanly-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
